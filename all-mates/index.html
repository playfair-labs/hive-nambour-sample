<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="All Mates" />
<meta name="theme-color" content="#fbf6ea" />
<meta name="allmates-build" content="pages-p1-tools-cal" />
<title>All Mates On Deck</title>
<style>
  :root{
    --bg:#fbf6ea; --ink:#1a1a1a; --navy:#1b2a4a; --gold:#c8a227;
    --hive:#c8f54a; --muted:#8a8476; --sun:#f5c431; --must:#f2d14a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#efe6d2;touch-action:manipulation;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    overscroll-behavior-x:none}
  body{display:flex;justify-content:center}
  .phone{width:100%;max-width:390px;height:100dvh;background:var(--bg);position:relative;
    overflow:hidden;display:flex;flex-direction:column;overscroll-behavior-x:none}
  .cal{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:max(10px,env(safe-area-inset-top)) 8px 96px;scroll-behavior:smooth}
  .row{display:grid;grid-template-columns:22px 1fr;align-items:center;gap:0;
    min-height:38vh;padding:8px 2px}
  .day{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--navy);opacity:.55;
    writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;pointer-events:none}
  .who{position:absolute;left:6px;top:2px;z-index:6;pointer-events:none;
    max-width:72%;color:var(--navy);line-height:1.02;filter:drop-shadow(0 1px 0 #fffdf6)}
  .who .lead{display:block;font-size:clamp(22px,6.6vw,30px);font-weight:800;
    letter-spacing:-.035em}
  .who .vessel{display:block;font-size:clamp(20px,6vw,28px);font-weight:800;
    letter-spacing:-.03em;opacity:.92}
  .need{position:absolute;right:2px;top:46%;transform:translateY(-50%);z-index:6;
    pointer-events:none;font-size:clamp(64px,22vw,92px);font-weight:900;
    letter-spacing:-.07em;line-height:.8;color:var(--navy);opacity:.78;
    font-variant-numeric:tabular-nums;filter:drop-shadow(0 1px 0 #fffdf6)}
  .need.off{display:none}
  .asks{position:absolute;left:4px;bottom:6px;z-index:7;display:flex;flex-direction:column;
    align-items:flex-start;gap:6px;max-width:52%;pointer-events:auto}
  .tool{appearance:none;-webkit-appearance:none;font-family:inherit;cursor:pointer;
    pointer-events:auto;font-size:clamp(16px,4.4vw,19px);font-weight:800;letter-spacing:-.03em;
    line-height:1.05;color:var(--navy);background:rgba(255,253,246,.94);border:1.5px solid var(--navy);
    border-radius:11px;padding:7px 11px;white-space:nowrap;box-shadow:0 1px 0 #fffdf6;
    touch-action:none}
  .tool.holding{transform:scale(.96);box-shadow:0 0 0 3px var(--hive),0 1px 0 #fffdf6}
  .tool.fly{animation:toolFly .42s cubic-bezier(.22,1.1,.3,1) both}
  @keyframes toolFly{
    0%{transform:translate(0,0) scale(1);opacity:1}
    100%{transform:translate(84px,-32px) scale(.55);opacity:0}
  }
  .stock{position:absolute;left:6px;right:6px;bottom:6px;z-index:7;display:flex;flex-wrap:wrap;
    justify-content:center;gap:6px}
  .stock .tool{border-style:dashed;opacity:.72}
  .stock .tool.on{border-style:solid;opacity:1;background:var(--hive)}
  .seat .loots{position:absolute;left:50%;top:104%;transform:translateX(-50%);z-index:2;
    display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none}
  .seat .loot{pointer-events:auto;font-size:10px;font-weight:800;letter-spacing:-.02em;
    color:var(--navy);white-space:nowrap;background:#fffdf6;border:1.5px solid var(--navy);
    border-radius:7px;padding:1px 5px;box-shadow:0 1px 0 rgba(0,0,0,.08)}
  .seat.you .loot{background:var(--hive)}
  .plate.peek .seat .tag{top:calc(108% + 15px)}
  .cal-card{position:absolute;left:12px;right:12px;z-index:14;
    top:max(10px,env(safe-area-inset-top));bottom:auto;
    background:#fffdf6;border:2px solid var(--navy);border-radius:16px;padding:12px 14px 13px;
    box-shadow:0 10px 28px rgba(40,30,10,.16);opacity:0;transform:translateY(-10px);
    pointer-events:none;transition:opacity .2s,transform .2s}
  .cal-card.on{opacity:1;transform:none;pointer-events:auto}
  .cal-card .k{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted)}
  .cal-card .t{display:block;font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.15;
    margin:4px 0 2px}
  .cal-card .w{display:block;font-size:14px;font-weight:650;color:var(--navy)}
  .cal-card .h{display:block;font-size:12px;color:var(--muted);margin-top:6px;line-height:1.35}
  .who .loot{display:block;margin-top:4px;width:max-content;font-size:12px;font-weight:800;
    letter-spacing:-.02em;background:var(--hive);border:1.5px solid var(--navy);border-radius:8px;
    padding:1px 7px;pointer-events:auto}
  .row.eve .who,.row.eve .need{color:#f4f0e6;filter:drop-shadow(0 1px 0 #1b2438)}
  .plate{position:relative;width:100%;aspect-ratio:16/9;touch-action:none;overflow:visible}
  .plate svg{display:block;overflow:visible}
  .medium{width:100%;height:100%}
  .sky,.medium,.sundial{position:absolute;inset:0;pointer-events:none}
  /* Extra sky above the plate so the high midday apex is visible + hittable. */
  .sundial{z-index:4;pointer-events:none;inset:auto;left:0;right:0;top:-28%;
    width:100%;height:128%;overflow:visible}
  .sundial .hit{pointer-events:auto;fill:transparent;cursor:ew-resize;stroke:#000;stroke-opacity:0}
  .sun-readout{position:absolute;left:50%;top:max(10px,env(safe-area-inset-top));
    transform:translateX(-50%) translateY(-8px) scale(.94);z-index:12;pointer-events:none;
    opacity:0;transition:opacity .16s ease,transform .16s ease;font-variant-numeric:tabular-nums}
  .sun-readout.on{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
  .sun-readout .digits{display:block;font-size:clamp(26px,8.4vw,38px);font-weight:800;
    letter-spacing:-.03em;line-height:1;color:var(--navy);background:rgba(255,253,246,.94);
    border:2px solid var(--navy);border-radius:16px;padding:8px 16px 9px;
    box-shadow:0 8px 22px rgba(40,30,10,.14)}
  .sun-readout .digits.pop{animation:digitPop .18s cubic-bezier(.22,1.2,.3,1)}
  @keyframes digitPop{
    0%{transform:scale(1.12)}
    100%{transform:scale(1)}
  }
  .tub-spin{position:absolute;inset:0;z-index:3;transform-origin:50% 78%;
    transition:transform .7s cubic-bezier(.22,.8,.25,1);pointer-events:none}
  .tub-spin .tub{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
  .mates{position:absolute;inset:0;z-index:5;pointer-events:none}
  .seat{position:absolute;width:18%;aspect-ratio:1;transform:translate(-50%,-50%);
    border-radius:50%;overflow:visible;z-index:1}
  .seat img,.seat .face{width:100%;height:100%;border-radius:50%;object-fit:cover;
    display:block;border:2px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.18);background:#243028}
  .seat.you img,.seat.you .face{box-shadow:0 0 0 3px var(--hive),0 2px 0 rgba(0,0,0,.18)}
  .seat .tag{display:none;position:absolute;left:50%;top:108%;transform:translateX(-50%);
    font-size:12px;font-weight:800;letter-spacing:.03em;color:var(--navy);white-space:nowrap;
    background:#fffdf6;border:1.5px solid var(--navy);border-radius:8px;padding:1px 6px}
  .plate.peek .seat .tag{display:block}
  .plate.peek .seat{width:20%}
  .seat.pop-in{animation:popIn .48s cubic-bezier(.22,1.2,.3,1) both}
  .seat.pop-out{animation:popOut .42s ease-in both}
  .seat.leave-x::after{content:"✕";position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;color:#d13b3b;font-size:22px;font-weight:900;text-shadow:0 0 4px #fff}
  @keyframes popIn{
    0%{transform:translate(-50%,20%) scale(.15);opacity:0}
    70%{transform:translate(-50%,-62%) scale(1.18);opacity:1}
    100%{transform:translate(-50%,-50%) scale(1)}
  }
  @keyframes popOut{
    0%{transform:translate(-50%,-50%) scale(1);opacity:1}
    35%{transform:translate(-50%,-72%) scale(1.12)}
    100%{transform:translate(-50%,40%) scale(.2) rotate(18deg);opacity:0}
  }
  .plus{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));
    transform:translateX(-50%);width:58px;height:58px;border:0;border-radius:50%;
    background:#fffdf6;color:var(--navy);font-size:34px;line-height:1;font-weight:500;
    box-shadow:0 6px 18px rgba(40,30,10,.14);cursor:pointer;z-index:8;font-family:inherit}
  .plus:active{transform:translateX(-50%) scale(.96)}
  .picker{position:absolute;left:12px;right:12px;bottom:max(86px,calc(env(safe-area-inset-bottom) + 68px));
    z-index:8;display:flex;gap:8px;justify-content:center;pointer-events:none;
    opacity:0;transform:translateY(12px);transition:opacity .22s,transform .22s}
  .picker.on{opacity:1;transform:none;pointer-events:auto}
  .pick{flex:1;aspect-ratio:16/9;border:0;padding:0;background:#fffdf6;border-radius:12px;
    cursor:pointer;overflow:hidden;box-shadow:0 4px 10px rgba(40,30,10,.1)}
  .pick img{width:100%;height:100%;object-fit:contain;display:block}
  .hidden{display:none!important}
  .compose .sundial{filter:drop-shadow(0 0 6px rgba(245,196,49,.55))}
  .night .phone, .row.eve .plate{filter:none}
  .row.eve{background:linear-gradient(180deg,#1b2438 0%,#fbf6ea 72%)}
  .row.eve .day{color:#f4f0e6}
  .medium{transition:opacity .2s}
</style>
</head>
<body>
<div class="phone">
  <div class="sun-readout" id="sunReadout" aria-hidden="true"></div>
  <div class="cal" id="cal" aria-label="Boats"></div>
  <div class="picker" id="picker" aria-hidden="true"></div>
  <div class="cal-card" id="calCard" hidden></div>
  <button type="button" class="plus" id="plus" aria-label="New boat">+</button>
</div>
<script>
/* Invite-only private mates sample. No outreach, no discovery, no texts.
   No before/after job photos. No in-app messaging server.
   Tools are listed needs on the boat. Hold a need to claim it (same family as join).
   Join/claim writes a phone calendar event via .ics — browsers have no Calendar write API. */
const BUILD = 'pages-p1-tools-cal';
const $ = id => document.getElementById(id);
const ink = '#1a1a1a';
/* Faces sit in the clawfoot bowl, stacked around the painted captain. */
const SEATS = [
  {x:34,y:62},{x:44,y:59},{x:28,y:56},{x:40,y:54},{x:50,y:58}
];
const VESSELS = {
  soup:['Gravy Boat','Bisque','Stock Pot','The Ladle'],
  tennis:['Love-All','Deuce','Ace High','Baseline'],
  garden:['Sea Biscuit','Mulch','Wheelbarrow','Clippings'],
  water:['Tubby','Clawfoot','Soapdish']
};
const INHERENT = 8; /* baked bow-up in the locked plate */
const TOOLBOX = {
  soup:['ladle','pot','spoons'],
  tennis:['racquet','hopper','net'],
  garden:['rake','chainsaw','clippers','barrow'],
  water:['towel','soap']
};

function esc(s){
  return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function matePhoto(seed){
  const h = Math.abs(Number(seed)*47)%360;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80"><rect width="80" height="80" fill="hsl(${h},32%,22%)"/><circle cx="40" cy="30" r="15" fill="hsl(${(h+24)%360},38%,58%)"/><ellipse cx="40" cy="70" rx="22" ry="20" fill="hsl(${h},28%,40%)"/></svg>`;
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);
}
const MATES = [
  {id:'al',name:'Al',photo:matePhoto(1),captain:true},
  {id:'amar',name:'Amar',photo:matePhoto(2)},
  {id:'andy',name:'Andy',photo:matePhoto(3)},
  {id:'chris',name:'Chris',photo:matePhoto(4)},
  {id:'mia',name:'Mia',photo:matePhoto(5)},
  {id:'nova',name:'Nova',photo:matePhoto(6)},
  {id:'remi',name:'Remi',photo:matePhoto(7)},
  {id:'renee',name:'Renee',photo:matePhoto(8)},
  {id:'val',name:'Val',photo:matePhoto(9)}
];
const YOU = {id:'you',name:'You',photo:matePhoto(21)};
function mateBy(id){ return id==='you' ? YOU : MATES.find(m=>m.id===id); }

function brisbaneNow(){
  return new Date(new Date().toLocaleString('en-US',{timeZone:'Australia/Brisbane'}));
}
function dayMeta(offset){
  const d = brisbaneNow();
  d.setDate(d.getDate()+offset);
  return {offset, short:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()], date:d};
}

/* Sun path is a 24h loop. t=0/1 is 05:00 at the left waterline.
   Day is a wide parabolic climb-and-fall (not a tight circle):
   05:00 left → midday apex high above the captain → 19:00 right.
   Night continues under the water / tub as a low complementary arch.
   Ends sit in-plate beside the tub (not through the figure); apex
   overflows the 16:9 plate so the hat has clear air. */
const DAWN_H = 5;
const NOON_H = 12;
const DUSK_H = 19;
const T_NOON = (NOON_H - DAWN_H) / 24;
const T_DUSK = (DUSK_H - DAWN_H) / 24;
const T_HALF = 0.5 / 24;
const SUN_X0 = 32;
const SUN_X1 = 768;
const SUN_Y_APEX = -58;
const SUN_Y_RIM = 338;
const SUN_Y_NIGHT = 482;
const SUN_HIT_PX = 44;

function wrap01(t){ return ((t % 1) + 1) % 1; }
function hourToT(h){
  let x = (h - DAWN_H) / 24;
  x = x - Math.floor(x);
  return x;
}
function tToHour(t){ return DAWN_H + wrap01(t) * 24; }
function snapHour(h){ return Math.round(h * 2) / 2; }
function snapT(t){ return hourToT(snapHour(tToHour(t))); }

function dayRise(u){
  /* Flatter than a circle: high plateau over the captain, low only at the rims. */
  const s = Math.abs(2 * u - 1);
  return 1 - Math.pow(s, 3.35);
}
function sunPoint(t){
  const tt = wrap01(t);
  if(tt <= T_DUSK){
    const u = tt / T_DUSK;
    return {
      x: SUN_X0 + (SUN_X1 - SUN_X0) * u,
      y: SUN_Y_RIM - (SUN_Y_RIM - SUN_Y_APEX) * dayRise(u)
    };
  }
  const u = (tt - T_DUSK) / (1 - T_DUSK);
  return {
    x: SUN_X1 + (SUN_X0 - SUN_X1) * u,
    y: SUN_Y_RIM + 4 * (SUN_Y_NIGHT - SUN_Y_RIM) * u * (1 - u)
  };
}
function clientSunHit(x, y, svg){
  const t = tFromPoint(x, y, svg);
  const p = sunPoint(t);
  const r = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  const cx = r.left + ((p.x - vb.x) / vb.width) * r.width;
  const cy = r.top + ((p.y - vb.y) / vb.height) * r.height;
  return {t, dist: Math.hypot(x - cx, y - cy)};
}
function sunPathD(t0, t1){
  const a = Math.max(0, Math.min(1, t0));
  const b = Math.max(0, Math.min(1, t1));
  if(b - a < 1e-4){
    const p = sunPoint(a);
    return `M${p.x.toFixed(1)} ${p.y.toFixed(1)}`;
  }
  const n = Math.max(16, Math.ceil((b - a) * 72));
  let d = '';
  for(let i=0;i<=n;i++){
    const p = sunPoint(a + (b - a) * i / n);
    d += (i ? 'L' : 'M') + p.x.toFixed(1) + ' ' + p.y.toFixed(1);
  }
  return d;
}
function tFromPoint(x, y, svg){
  const r = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  const px = vb.x + ((x - r.left) / r.width) * vb.width;
  const py = vb.y + ((y - r.top) / r.height) * vb.height;
  const dist2 = t => {
    const p = sunPoint(t);
    const dx = p.x - px, dy = p.y - py;
    return dx * dx + dy * dy;
  };
  let bestT = 0, bestD = Infinity;
  const steps = 120;
  for(let i=0;i<=steps;i++){
    const t = i / steps;
    const d = dist2(t);
    if(d < bestD){ bestD = d; bestT = t; }
  }
  let lo = Math.max(0, bestT - 1 / steps);
  let hi = Math.min(1, bestT + 1 / steps);
  for(let k=0;k<14;k++){
    const t1 = lo + (hi - lo) / 3;
    const t2 = hi - (hi - lo) / 3;
    if(dist2(t1) < dist2(t2)) hi = t2;
    else lo = t1;
  }
  return (lo + hi) / 2;
}
function rangeMidT(b){
  if(b.allDay) return T_NOON;
  return (b.sunStart + b.sunEnd) / 2;
}
function isEvening(b){
  if(b.allDay) return false;
  const h = tToHour(rangeMidT(b)) % 24;
  return h >= 17.5 || h < 5;
}
function isMoon(b){
  if(b.allDay) return false;
  return rangeMidT(b) > T_DUSK;
}
function clockParts(t){
  let h = snapHour(tToHour(t));
  h = ((h % 24) + 24) % 24;
  const mins = Math.round(h * 2) % 2 ? 30 : 0;
  const hr24 = Math.floor(h) % 24;
  const ap = hr24 >= 12 ? 'PM' : 'AM';
  let hr = hr24 % 12;
  if(!hr) hr = 12;
  return {text:`${hr}:${mins===0?'00':'30'}`, ap};
}
function formatRange(a, b, allDay){
  if(allDay) return 'All day';
  const A = clockParts(a), B = clockParts(b);
  if(A.ap === B.ap) return `${A.text} – ${B.text} ${A.ap}`;
  return `${A.text} ${A.ap} – ${B.text} ${B.ap}`;
}
function showReadout(text){
  const el = $('sunReadout');
  if(!el) return;
  el.classList.add('on');
  el.setAttribute('aria-hidden', 'false');
  if(el.dataset.txt === text) return;
  el.dataset.txt = text;
  el.innerHTML = `<span class="digits pop">${esc(text)}</span>`;
}
function hideReadout(){
  const el = $('sunReadout');
  if(!el) return;
  el.classList.remove('on');
  el.setAttribute('aria-hidden', 'true');
  el.dataset.txt = '';
  el.innerHTML = '';
}

function pad2(n){ return String(n).padStart(2,'0'); }
function icsStamp(d){
  return `${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}T${pad2(d.getHours())}${pad2(d.getMinutes())}00`;
}
function icsDay(d){
  return `${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}`;
}
function boatClock(b, which){
  const d = brisbaneNow();
  d.setDate(d.getDate() + (b.day|0));
  const h = b.allDay
    ? (which==='end' ? 19 : 5)
    : snapHour(tToHour(which==='end' ? b.sunEnd : b.sunStart));
  d.setHours(Math.floor(h)%24, (h%1) ? 30 : 0, 0, 0);
  return d;
}
function icsFold(s){
  return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
}
function toICS(evt){
  const uid = evt.uid || ('amod-'+Date.now()+'@all-mates');
  const now = brisbaneNow();
  const lines = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//All Mates//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH',
    'BEGIN:VEVENT','UID:'+uid,'DTSTAMP:'+icsStamp(now)
  ];
  if(evt.allDay){
    const a = evt.start, b = new Date(evt.end);
    b.setDate(b.getDate()+1);
    lines.push('DTSTART;VALUE=DATE:'+icsDay(a));
    lines.push('DTEND;VALUE=DATE:'+icsDay(b));
  } else {
    lines.push('DTSTART;TZID=Australia/Brisbane:'+icsStamp(evt.start));
    lines.push('DTEND;TZID=Australia/Brisbane:'+icsStamp(evt.end));
  }
  lines.push('SUMMARY:'+icsFold(evt.summary));
  if(evt.desc) lines.push('DESCRIPTION:'+icsFold(evt.desc));
  if(evt.where) lines.push('LOCATION:'+icsFold(evt.where));
  lines.push('END:VEVENT','END:VCALENDAR');
  return lines.join('\r\n');
}
function isIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
}
function downloadICS(ics, filename){
  /* iPhone: text/calendar opens Calendar. Desktop: octet-stream so Chrome
     downloads instead of popping a blob preview tab. */
  const type = isIOS() ? 'text/calendar;charset=utf-8' : 'application/octet-stream';
  const blob = new Blob([ics], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename || 'all-mates.ics';
  a.rel = 'noopener';
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  return url;
}
let calTimer = null;
function showCalCard(evt, how){
  const el = $('calCard');
  if(!el) return;
  const howLine = how==='ics'
    ? 'Wrote Calendar · .ics — iPhone opens Calendar'
    : how==='cancel'
      ? 'Calendar write cancelled.'
      : 'Sample card — this page cannot write the native Calendar store.';
  el.hidden = false;

function writeCalendarFor(b){

/* Angle = remaining need. Level = finished. Nearly-flat empty = need one. Steep = many. */
function tipDeg(boat){
  const aboard = (boat.mates||[]).length;
  const need = Math.max(1, boat.need|0);
  const rem = Math.max(0, need-aboard);
  if(rem===0) return 0;
  const emptyTip = 7 + (need-1)*8;
  return emptyTip * (rem/need);
}
/* Hours shrink with heads in the tub. Captain counts. 5 alone → 1 with five aboard. */
function hoursMark(boat){
  const base = Math.max(1, (boat.hours|0) || 3);
  const heads = 1 + (boat.mates||[]).length;
  return Math.max(1, Math.round(base/heads));
}
function remainNeed(boat){
  return Math.max(0, Math.max(1, boat.need|0) - (boat.mates||[]).length);
}
/* Flood depth = remaining hours. Deep water / tub sits low when alone;
   water drops and the boat rides higher as mates board. */
function floodLevel(boat){
  const h = Math.max(1, Math.min(5, hoursMark(boat)));
  const t = (h - 1) / 4;
  return {
    hours: h,
    waterY: 438 - t * 188,
    lift: -11 + t * 18
  };
}
function leadMate(boat){
  if(boat.mine) return YOU;
  return mateBy(boat.owner) || mateBy((boat.mates||[])[0]) || MATES[0];
}
function vesselName(medium, seed){
  const list = VESSELS[medium] || VESSELS.water;
  if(seed==null) return list[Math.floor(Math.random()*list.length)];
  return list[Math.abs(Number(seed)||0) % list.length];
}
function poss(name){
  if(name==='You') return 'Your';
  const n = String(name||'Mate');
  return /s$/i.test(n) ? n+"'" : n+"'s";
}
function toolSlug(name){ return String(name||'').toLowerCase().replace(/[^a-z0-9]+/g,''); }
function boatTools(b){ return Array.isArray(b.tools) ? b.tools : []; }
function openTools(b){ return boatTools(b).filter(t=>!t.by); }
function visibleAsks(b){
  const fly = (anim[b.id]||{}).fly;
  return boatTools(b).filter(t=>!t.by || (t.by==='you' && t.id===fly));
}
function lootFor(b, mateId){
  return boatTools(b).filter(t=>t.by===mateId).map(t=>t.name);
}
function bringLine(b){
  const loot = lootFor(b,'you');
  return loot.length ? loot.join(', ') : '';
}
function calTitle(b){
  const lead = leadMate(b);
  const bring = bringLine(b);
  const vessel = b.vessel || vesselName(b.medium, 0);
  return bring ? `${poss(lead.name)} · ${bring}` : `${poss(lead.name)} · ${vessel}`;
}

function boatRow(b){
  const d = dayMeta(b.day);
  const tip = spinDeg(b);
  const flood = floodLevel(b);
  const eve = isEvening(b);
  const peek = peekId===b.id ? ' peek' : '';
  const compose = composeId===b.id ? ' compose' : '';
  const rem = remainNeed(b);
  const lead = leadMate(b);
  const vessel = b.vessel || vesselName(b.medium, 0);
  const seats = (b.mates||[]).map((id,i)=>{
    const p = mateBy(id); if(!p) return '';
    const s = SEATS[i] || {x:30+i*6, y:56};
    const extra = (anim[b.id]||{})[id] || '';
    const loot = lootFor(b,id);
    const lootHtml = loot.length ? `<div class="loots">${loot.map(name=>
      `<span class="loot" ${id==='you'?`data-tool="${esc(toolSlug(name))}"`:''}>${esc(name)}</span>`

  }).join('');

    const on = boatTools(b).some(t=>t.id===toolSlug(name));

  }).join('')}</div>` : '';
  return `<div class="row ${b.day===0?'now':''} ${eve?'eve':''}" data-boat="${b.id}">
    <div class="day">${esc(d.short)}</div>
    <div class="plate${peek}${compose}" data-id="${b.id}" aria-label="Boat">
      ${mediumSvg(b.medium, eve, b)}
      <div class="tub-spin" style="transform:translateY(${flood.lift}%) rotate(${tip}deg)">
        <img class="tub" alt="" draggable="false" src="${plateSrc(b.medium)}"/>
        <div class="mates">${seats}</div>
      </div>
      ${sunSvg(b)}
      <div class="who"><span class="lead">${esc(lead.name)}</span><span class="vessel">${esc(vessel)}</span>${(b.mine?lootFor(b,'you'):[]).map(name=>`<span class="loot" data-tool="${esc(toolSlug(name))}">${esc(name)}</span>`).join('')}</div>
      <div class="need${rem?'' : ' off'}">${rem||''}</div>

function findBoat(id){ return boats.find(b=>b.id===id); }
function toolAt(plate, x, y){
  if(!plate) return null;
  const nodes = plate.querySelectorAll('[data-tool]');
  let best = null, bestD = Infinity;
  nodes.forEach(el=>{
    const r = el.getBoundingClientRect();
    const pad = 18;
    if(x < r.left - pad || x > r.right + pad || y < r.top - pad || y > r.bottom + pad) return;
    const d = Math.hypot(x - (r.left+r.right)/2, y - (r.top+r.bottom)/2);
    if(d < bestD){ best = el; bestD = d; }
  });
  return best;
}

function togglePeek(id){
  peekId = peekId===id ? null : id;
  render();
}
function dropYourTools(b){
  boatTools(b).forEach(t=>{ if(t.by==='you') t.by=null; });
}
function toggleJoin(id, opts){
  const b = findBoat(id); if(!b || b.mine) return;
  const silent = !!(opts && opts.silent);
  const i = b.mates.indexOf('you');
  if(i>=0){
    anim[b.id] = {you:'you leave-x pop-out'};
    render();
    setTimeout(()=>{
      b.mates = b.mates.filter(m=>m!=='you');
      dropYourTools(b);
      delete (anim[b.id]||{}).you;
      save(); render();
    }, 400);
  } else {
    if(b.mates.length>=Math.max(b.need,5)) return false;
    b.mates = b.mates.concat('you');
    anim[b.id] = Object.assign(anim[b.id]||{}, {you:'you pop-in'});
    save(); render();
    setTimeout(()=>{ if(anim[b.id]) delete anim[b.id].you; }, 500);
    if(!silent) writeCalendarFor(b);
    return true;
  }
}
function boardIfNeeded(b){
  if(b.mine) return true;
  if((b.mates||[]).includes('you')) return true;
  return toggleJoin(b.id, {silent:true})!==false && (b.mates||[]).includes('you');
}
function claimTool(id, toolId){
  const b = findBoat(id); if(!b) return;
  const t = boatTools(b).find(x=>x.id===toolId);
  if(!t) return;
  if(t.by && t.by!=='you') return;
  if(t.by==='you'){
    t.by = null;
    save(); render();
    if((b.mates||[]).includes('you') || b.mine) writeCalendarFor(b);
    return;
  }
  if(!boardIfNeeded(b)) return;
  t.by = 'you';
  anim[b.id] = Object.assign(anim[b.id]||{}, {fly:t.id});
  save(); render();
  writeCalendarFor(b);
  setTimeout(()=>{
    if(anim[b.id] && anim[b.id].fly===t.id) delete anim[b.id].fly;
    render();
  }, 420);
}
function togglePosterTool(id, name){
  const b = findBoat(id);
  if(!b || !b.mine || composeId!==id) return;
  const tid = toolSlug(name);
  b.tools = boatTools(b);
  const i = b.tools.findIndex(t=>t.id===tid);
  if(i>=0){
    if(b.tools[i].by && b.tools[i].by!=='you') return;
    b.tools.splice(i,1);
  } else {
    b.tools.push({id:tid, name, by:null});
  }
  save(); render();
}

let drag = null;
function bindPlates(){
  $('cal').querySelectorAll('.plate').forEach(el=>{
    el.onpointerdown = onDown;
    el.onpointermove = onMove;
    el.onpointerup = onUp;
    el.onpointercancel = onUp;
  });
}

function onDown(e){
  hideCalCard();
  const plate = e.currentTarget;
  const id = plate.dataset.id;
  const b = findBoat(id); if(!b) return;
  const addEl = e.target.closest('[data-add]');
  if(addEl){
    e.preventDefault();
    togglePosterTool(id, addEl.dataset.add);
    drag = {id, plate, pointer:e.pointerId, x:e.clientX, y:e.clientY, moved:true, held:true};
    try{ plate.setPointerCapture(e.pointerId); }catch(err){}
    return;
  }
  const toolEl = e.target.closest('[data-tool]') || toolAt(plate, e.clientX, e.clientY);
  if(toolEl) e.preventDefault();
  const svg = plate.querySelector('[data-sun]');
  const hit = (!b.must && !toolEl && svg) ? clientSunHit(e.clientX, e.clientY, svg) : null;
  const onSun = !!(hit && hit.dist <= SUN_HIT_PX);
  const startT = onSun ? snapT(hit.t) : null;
  drag = {
    id, plate, pointer:e.pointerId,
    x:e.clientX, y:e.clientY, moved:false, held:false,
    sun: onSun, startT, lastT:startT,
    need0: b.need, tip0: e.clientY,
    tool: toolEl ? toolEl.dataset.tool : null,
    toolEl
  };
  try{ plate.setPointerCapture(e.pointerId); }catch(err){}
  if(toolEl) toolEl.classList.add('holding');
  drag.hold = setTimeout(()=>{
    if(!drag || drag.sun) return;
    drag.held = true;
    if(drag.hold){ clearTimeout(drag.hold); drag.hold=null; }
    if(drag.tool) claimTool(id, drag.tool);
    else toggleJoin(id);
  }, 400);
  if(drag.sun){
    showReadout(formatRange(b.sunStart, b.sunEnd, b.allDay));
  }
}
function onMove(e){
  if(!drag) return;
  const dx = e.clientX-drag.x, dy = e.clientY-drag.y;
  const dist = Math.hypot(dx,dy);
  if(dist>36) drag.moved = true;
  if(drag.sun && dist>8) drag.moved = true;
  if(drag.tool && dist>44) drag.moved = true;
  if(drag.moved && drag.hold && (drag.sun || (drag.tool && dist>44) || Math.abs(dy)>28)){
    clearTimeout(drag.hold); drag.hold=null;
    if(drag.toolEl) drag.toolEl.classList.remove('holding');
  }
  const b = findBoat(drag.id); if(!b) return;
  if(drag.tool) return;
  if(drag.sun){
    e.preventDefault();
    const svg = drag.plate.querySelector('[data-sun]');
    const t = tFromPoint(e.clientX,e.clientY,svg);
    let a = snapT(drag.startT), c = snapT(t);
    if(c<a){ const x=a; a=c; c=x; }
    if(c-a < T_HALF - 1e-9) c = snapT(Math.min(1, a + T_HALF));
    b.allDay = (a<=0.03 && c>=T_DUSK - 0.03);
    b.sunStart = b.allDay ? 0 : a;
    b.sunEnd = b.allDay ? 1 : c;
    const eve = isEvening(b);
    drag.plate.parentElement.classList.toggle('eve', eve);
    const wrap = drag.plate.querySelector('.sundial');
    if(wrap) wrap.outerHTML = sunSvg(b);
    showReadout(formatRange(b.sunStart, b.sunEnd, b.allDay));
    return;
  }
  if(composeId===b.id && drag.moved && Math.abs(dy)>Math.abs(dx)){
    e.preventDefault();
    const next = Math.max(1, Math.min(5, Math.round(drag.need0 + (-dy)/36)));
    if(next!==b.need){
      b.need = next;
      const flood = floodLevel(b);
      const spin = drag.plate.querySelector('.tub-spin');
      if(spin) spin.style.transform = `translateY(${flood.lift}%) rotate(${spinDeg(b)}deg)`;
      const needEl = drag.plate.querySelector('.need');
      if(needEl){
        const rem = remainNeed(b);
        needEl.textContent = rem || '';
        needEl.classList.toggle('off', !rem);
      }
    }
  }
}
function onUp(e){
  if(!drag) return;
  if(drag.hold) clearTimeout(drag.hold);
  if(drag.toolEl) drag.toolEl.classList.remove('holding');
  const id = drag.id;
  const wasSun = drag.sun;
  const moved = drag.moved;
  const held = drag.held;
  drag = null;
  if(wasSun){ hideReadout(); save(); render(); return; }
  if(!moved && !held){
    if(composeId && composeId!==id) composeId = null;
    togglePeek(id);
    return;
  }
  if(moved) save();
}

$('plus').onclick = ()=>{
  pickerOn = !pickerOn;
  if(pickerOn) composeId = null;
  render();
};
$('picker').onclick = e=>{
  const p = e.target.closest('[data-med]'); if(!p) return;
  createBoat(p.dataset.med);
};
$('cal').onclick = e=>{
  if(e.target.closest('.plate')) return;
  if(composeId){ composeId=null; render(); }
};
$('calCard').onclick = ()=> hideCalCard();
document.querySelector('.phone').addEventListener('contextmenu', e=>{
  e.preventDefault();
});

render();
</script>
</body>
