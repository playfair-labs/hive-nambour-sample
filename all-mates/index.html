<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="All Mates" />
<meta name="theme-color" content="#fbf6ea" />
<meta name="allmates-build" content="pages-p1-sundial-arc" />
<title>All Mates On Deck</title>
<style>
  :root{
    --bg:#fbf6ea; --ink:#1a1a1a; --navy:#1b2a4a; --gold:#c8a227;
    --hive:#c8f54a; --muted:#8a8476; --sun:#f5c431; --must:#f2d14a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#efe6d2;touch-action:manipulation;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    overscroll-behavior-x:none}
  body{display:flex;justify-content:center}
  .phone{width:100%;max-width:390px;height:100dvh;background:var(--bg);position:relative;
    overflow:hidden;display:flex;flex-direction:column;overscroll-behavior-x:none}
  .cal{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:max(10px,env(safe-area-inset-top)) 8px 96px;scroll-behavior:smooth}
  .row{display:grid;grid-template-columns:22px 1fr;align-items:center;gap:0;
    min-height:38vh;padding:8px 2px}
  .day{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--navy);opacity:.55;
    writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;pointer-events:none}
  .hrs{position:absolute;right:4px;top:50%;transform:translateY(-50%);z-index:6;
    font-size:13px;font-weight:800;color:var(--navy);opacity:.45;pointer-events:none;
    letter-spacing:.02em;line-height:1}
  .plate{position:relative;width:100%;aspect-ratio:16/9;touch-action:none;overflow:visible}
  .plate svg{display:block;overflow:visible}
  .medium{width:100%;height:100%}
  .sky,.medium,.sundial{position:absolute;inset:0;pointer-events:none}
  /* Extra sky above the plate so the high midday apex is visible + hittable. */
  .sundial{z-index:4;pointer-events:none;inset:auto;left:0;right:0;top:-28%;
    width:100%;height:128%;overflow:visible}
  .sundial .hit{pointer-events:auto;fill:transparent;cursor:ew-resize;stroke:#000;stroke-opacity:0}
  .sun-readout{position:absolute;left:50%;top:max(10px,env(safe-area-inset-top));
    transform:translateX(-50%) translateY(-8px) scale(.94);z-index:12;pointer-events:none;
    opacity:0;transition:opacity .16s ease,transform .16s ease;font-variant-numeric:tabular-nums}
  .sun-readout.on{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
  .sun-readout .digits{display:block;font-size:clamp(26px,8.4vw,38px);font-weight:800;
    letter-spacing:-.03em;line-height:1;color:var(--navy);background:rgba(255,253,246,.94);
    border:2px solid var(--navy);border-radius:16px;padding:8px 16px 9px;
    box-shadow:0 8px 22px rgba(40,30,10,.14)}
  .sun-readout .digits.pop{animation:digitPop .18s cubic-bezier(.22,1.2,.3,1)}
  @keyframes digitPop{
    0%{transform:scale(1.12)}
    100%{transform:scale(1)}
  }
  .tub-spin{position:absolute;inset:0;z-index:3;transform-origin:50% 78%;
    transition:transform .7s cubic-bezier(.22,.8,.25,1);pointer-events:none}
  .tub-spin .tub{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
  .mates{position:absolute;inset:0;z-index:5;pointer-events:none}
  .seat{position:absolute;width:15%;aspect-ratio:1;transform:translate(-50%,-50%);
    border-radius:50%;overflow:visible}
  .seat img,.seat .face{width:100%;height:100%;border-radius:50%;object-fit:cover;
    display:block;border:2px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.18);background:#243028}
  .seat.you img,.seat.you .face{box-shadow:0 0 0 3px var(--hive),0 2px 0 rgba(0,0,0,.18)}
  .seat .tag{display:none;position:absolute;left:50%;top:108%;transform:translateX(-50%);
    font-size:12px;font-weight:800;letter-spacing:.03em;color:var(--navy);white-space:nowrap;
    background:#fffdf6;border:1.5px solid var(--navy);border-radius:8px;padding:1px 6px}
  .plate.peek .seat .tag{display:block}
  .plate.peek .seat{width:20%}
  .seat.pop-in{animation:popIn .48s cubic-bezier(.22,1.2,.3,1) both}
  .seat.pop-out{animation:popOut .42s ease-in both}
  .seat.leave-x::after{content:"✕";position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;color:#d13b3b;font-size:22px;font-weight:900;text-shadow:0 0 4px #fff}
  @keyframes popIn{
    0%{transform:translate(-50%,20%) scale(.15);opacity:0}
    70%{transform:translate(-50%,-62%) scale(1.18);opacity:1}
    100%{transform:translate(-50%,-50%) scale(1)}
  }
  @keyframes popOut{
    0%{transform:translate(-50%,-50%) scale(1);opacity:1}
    35%{transform:translate(-50%,-72%) scale(1.12)}
    100%{transform:translate(-50%,40%) scale(.2) rotate(18deg);opacity:0}
  }
  .plus{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));
    transform:translateX(-50%);width:58px;height:58px;border:0;border-radius:50%;
    background:#fffdf6;color:var(--navy);font-size:34px;line-height:1;font-weight:500;
    box-shadow:0 6px 18px rgba(40,30,10,.14);cursor:pointer;z-index:8;font-family:inherit}
  .plus:active{transform:translateX(-50%) scale(.96)}
  .picker{position:absolute;left:12px;right:12px;bottom:max(86px,calc(env(safe-area-inset-bottom) + 68px));
    z-index:8;display:flex;gap:8px;justify-content:center;pointer-events:none;
    opacity:0;transform:translateY(12px);transition:opacity .22s,transform .22s}
  .picker.on{opacity:1;transform:none;pointer-events:auto}
  .pick{flex:1;aspect-ratio:16/9;border:0;padding:0;background:#fffdf6;border-radius:12px;
    cursor:pointer;overflow:hidden;box-shadow:0 4px 10px rgba(40,30,10,.1)}
  .pick img{width:100%;height:100%;object-fit:contain;display:block}
  .hidden{display:none!important}
  .compose .sundial{filter:drop-shadow(0 0 6px rgba(245,196,49,.55))}
  .night .phone, .row.eve .plate{filter:none}
  .row.eve{background:linear-gradient(180deg,#1b2438 0%,#fbf6ea 72%)}
  .row.eve .day{color:#f4f0e6}
</style>
</head>
<body>
<div class="phone">
  <div class="sun-readout" id="sunReadout" aria-hidden="true"></div>
  <div class="cal" id="cal" aria-label="Boats"></div>
  <div class="picker" id="picker" aria-hidden="true"></div>
  <button type="button" class="plus" id="plus" aria-label="New boat">+</button>
</div>
<script>
/* Invite-only private mates sample. No outreach, no discovery, no texts. */
const BUILD = 'pages-p1-sundial-arc';
const $ = id => document.getElementById(id);
const ink = '#1a1a1a';
const SEATS = [
  {x:36,y:52},{x:22,y:38},{x:44,y:44},{x:28,y:60},{x:50,y:36}
];
const INHERENT = 8; /* baked bow-up in the locked plate */

function esc(s){
  return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function matePhoto(seed){
  const h = Math.abs(Number(seed)*47)%360;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80"><rect width="80" height="80" fill="hsl(${h},32%,22%)"/><circle cx="40" cy="30" r="15" fill="hsl(${(h+24)%360},38%,58%)"/><ellipse cx="40" cy="70" rx="22" ry="20" fill="hsl(${h},28%,40%)"/></svg>`;
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);
}
const MATES = [
  {id:'al',name:'Al',photo:matePhoto(1),captain:true},
  {id:'amar',name:'Amar',photo:matePhoto(2)},
  {id:'andy',name:'Andy',photo:matePhoto(3)},
  {id:'chris',name:'Chris',photo:matePhoto(4)},
  {id:'mia',name:'Mia',photo:matePhoto(5)},
  {id:'nova',name:'Nova',photo:matePhoto(6)},
  {id:'remi',name:'Remi',photo:matePhoto(7)},
  {id:'renee',name:'Renee',photo:matePhoto(8)},
  {id:'val',name:'Val',photo:matePhoto(9)}
];
const YOU = {id:'you',name:'You',photo:matePhoto(21)};
function mateBy(id){ return id==='you' ? YOU : MATES.find(m=>m.id===id); }

function brisbaneNow(){
  return new Date(new Date().toLocaleString('en-US',{timeZone:'Australia/Brisbane'}));
}
function dayMeta(offset){
  const d = brisbaneNow();
  d.setDate(d.getDate()+offset);
  return {offset, short:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()], date:d};
}

/* Sun path is a 24h loop. t=0/1 is 05:00 at the left waterline.
   Day is a wide parabolic climb-and-fall (not a tight circle):
   05:00 left → midday apex high above the captain → 19:00 right.
   Night continues under the water / tub as a low complementary arch.
   Ends sit in-plate beside the tub (not through the figure); apex
   overflows the 16:9 plate so the hat has clear air. */
const DAWN_H = 5;
const NOON_H = 12;
const DUSK_H = 19;
const T_NOON = (NOON_H - DAWN_H) / 24;
const T_DUSK = (DUSK_H - DAWN_H) / 24;
const T_HALF = 0.5 / 24;
const SUN_X0 = 30;
const SUN_X1 = 770;
const SUN_Y_APEX = -36;
const SUN_Y_RIM = 332;
const SUN_Y_NIGHT = 470;

function wrap01(t){ return ((t % 1) + 1) % 1; }
function hourToT(h){
  let x = (h - DAWN_H) / 24;
  x = x - Math.floor(x);
  return x;
}
function tToHour(t){ return DAWN_H + wrap01(t) * 24; }
function snapHour(h){ return Math.round(h * 2) / 2; }
function snapT(t){ return hourToT(snapHour(tToHour(t))); }

function sunPoint(t){
  const tt = wrap01(t);
  if(tt <= T_DUSK){
    const u = tt / T_DUSK;
    return {
      x: SUN_X0 + (SUN_X1 - SUN_X0) * u,
      y: SUN_Y_RIM - 4 * (SUN_Y_RIM - SUN_Y_APEX) * u * (1 - u)
    };
  }
  const u = (tt - T_DUSK) / (1 - T_DUSK);
  return {
    x: SUN_X1 + (SUN_X0 - SUN_X1) * u,
    y: SUN_Y_RIM + 4 * (SUN_Y_NIGHT - SUN_Y_RIM) * u * (1 - u)
  };
}
function sunPathD(t0, t1){
  const a = Math.max(0, Math.min(1, t0));
  const b = Math.max(0, Math.min(1, t1));
  if(b - a < 1e-4){
    const p = sunPoint(a);
    return `M${p.x.toFixed(1)} ${p.y.toFixed(1)}`;
  }
  const n = Math.max(16, Math.ceil((b - a) * 72));
  let d = '';
  for(let i=0;i<=n;i++){
    const p = sunPoint(a + (b - a) * i / n);
    d += (i ? 'L' : 'M') + p.x.toFixed(1) + ' ' + p.y.toFixed(1);
  }
  return d;
}
function tFromPoint(x, y, svg){
  const r = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  const px = vb.x + ((x - r.left) / r.width) * vb.width;
  const py = vb.y + ((y - r.top) / r.height) * vb.height;
  const dist2 = t => {
    const p = sunPoint(t);
    const dx = p.x - px, dy = p.y - py;
    return dx * dx + dy * dy;
  };
  let bestT = 0, bestD = Infinity;
  const steps = 120;
  for(let i=0;i<=steps;i++){
    const t = i / steps;
    const d = dist2(t);
    if(d < bestD){ bestD = d; bestT = t; }
  }
  let lo = Math.max(0, bestT - 1 / steps);
  let hi = Math.min(1, bestT + 1 / steps);
  for(let k=0;k<14;k++){
    const t1 = lo + (hi - lo) / 3;
    const t2 = hi - (hi - lo) / 3;
    if(dist2(t1) < dist2(t2)) hi = t2;
    else lo = t1;
  }
  return (lo + hi) / 2;
}
function rangeMidT(b){
  if(b.allDay) return T_NOON;
  return (b.sunStart + b.sunEnd) / 2;
}
function isEvening(b){
  if(b.allDay) return false;
  const h = tToHour(rangeMidT(b)) % 24;
  return h >= 17.5 || h < 5;
}
function isMoon(b){
  if(b.allDay) return false;
  return rangeMidT(b) > T_DUSK;
}
function clockParts(t){
  let h = snapHour(tToHour(t));
  h = ((h % 24) + 24) % 24;
  const mins = Math.round(h * 2) % 2 ? 30 : 0;
  const hr24 = Math.floor(h) % 24;
  const ap = hr24 >= 12 ? 'PM' : 'AM';
  let hr = hr24 % 12;
  if(!hr) hr = 12;
  return {text:`${hr}:${mins===0?'00':'30'}`, ap};
}
function formatRange(a, b, allDay){
  if(allDay) return 'All day';
  const A = clockParts(a), B = clockParts(b);
  if(A.ap === B.ap) return `${A.text} – ${B.text} ${A.ap}`;
  return `${A.text} ${A.ap} – ${B.text} ${B.ap}`;
}
function showReadout(text){
  const el = $('sunReadout');
  if(!el) return;
  el.classList.add('on');
  el.setAttribute('aria-hidden', 'false');
  if(el.dataset.txt === text) return;
  el.dataset.txt = text;
  el.innerHTML = `<span class="digits pop">${esc(text)}</span>`;
}
function hideReadout(){
  const el = $('sunReadout');
  if(!el) return;
  el.classList.remove('on');
  el.setAttribute('aria-hidden', 'true');
  el.dataset.txt = '';
  el.innerHTML = '';
}

/* Angle = remaining need. Level = finished. Nearly-flat empty = need one. Steep = many. */
function tipDeg(boat){
  const aboard = (boat.mates||[]).length;
  const need = Math.max(1, boat.need|0);
  const rem = Math.max(0, need-aboard);
  if(rem===0) return 0;
  const emptyTip = 7 + (need-1)*8;
  return emptyTip * (rem/need);
}
/* Hours shrink with heads in the tub. Captain counts. 5 alone → 1 with five aboard. */
function hoursMark(boat){
  const base = Math.max(1, (boat.hours|0) || 3);
  const heads = 1 + (boat.mates||[]).length;
  return Math.max(1, Math.round(base/heads));
}

const MEDIA = {
  water:{fill:'#4aa3d4',deep:'#2f86b8',splash:'#7ec8e8',foam:'#e8f6fc'},
  soup:{fill:'#c47a32',deep:'#8a4a16',splash:'#e0a25a',foam:'#f0d2a0'},
  tennis:{fill:'#6dbf4c',deep:'#3e8a2a',splash:'#a6e07a',foam:'#e4f7c8'},
  garden:{fill:'#5a9a3a',deep:'#3d6a22',splash:'#8fd15a',foam:'#dce8b8'}
};

function waves(m){
  return `<path d="M-40 352 C40 338 80 366 160 350 C240 334 280 368 360 352 C440 336 480 366 560 350 C640 334 700 364 860 348 L860 520 L-40 520 Z" fill="${m.fill}"/>
    <path d="M-40 360 C50 348 90 372 170 358 C250 344 300 374 380 358 C460 342 510 372 590 356 C670 340 740 370 860 354" fill="none" stroke="${m.deep}" stroke-width="5"/>
    <path d="M-20 348 C20 330 48 356 78 340" fill="${m.splash}" stroke="${ink}" stroke-width="3"/>
    <path d="M70 336 C88 318 96 338 118 326 C128 342 90 350 70 336 Z" fill="${m.foam}" stroke="${ink}" stroke-width="3"/>`;
}
function gardenExtra(){
  return `<g stroke="${ink}" stroke-width="2.4">
    ${[40,90,150,220,290,360,430,500,570,640,710,770].map((x,i)=>
      `<path d="M${x} 348 C${x-6} 320 ${x+8} 312 ${x+2} 348" fill="${i%2?'#4e8c30':'#6aad3e'}"/>`
    ).join('')}
    <path d="M-40 400 C80 388 200 412 400 396 C600 380 720 408 860 392 L860 520 L-40 520 Z" fill="#5a3a20"/>
  </g>`;
}
function tennisBalls(){
  return `<g>
    <circle cx="120" cy="400" r="16" fill="#c8f54a" stroke="${ink}" stroke-width="3"/>
    <path d="M108 392 C120 400 120 408 132 410" fill="none" stroke="${ink}" stroke-width="2"/>
    <circle cx="620" cy="412" r="12" fill="#c8f54a" stroke="${ink}" stroke-width="3"/>
  </g>`;
}
function soupBits(){
  return `<g>
    <ellipse cx="140" cy="404" rx="10" ry="6" fill="#d4552a" stroke="${ink}" stroke-width="2"/>
    <ellipse cx="560" cy="418" rx="8" ry="5" fill="#6a8f2a" stroke="${ink}" stroke-width="2"/>
    <ellipse cx="240" cy="428" rx="7" ry="4" fill="#f0c14a" stroke="${ink}" stroke-width="2"/>
  </g>`;
}
function standingTool(kind){
  if(kind==='soup') return `<g transform="translate(640,250)">
    <path d="M18 8 C18 -6 42 -6 42 10 C42 38 30 48 30 78" fill="none" stroke="#8a5a28" stroke-width="10" stroke-linecap="round"/>
    <ellipse cx="30" cy="88" rx="22" ry="10" fill="#8a5a28" stroke="${ink}" stroke-width="3"/>
    <ellipse cx="30" cy="84" rx="14" ry="5" fill="#c47a32"/>
  </g>`;
  if(kind==='tennis') return `<g transform="translate(640,230)">
    <rect x="26" y="78" width="10" height="52" rx="5" fill="#1a1a1a" stroke="${ink}" stroke-width="3"/>
    <ellipse cx="31" cy="36" rx="28" ry="36" fill="none" stroke="#8a5a28" stroke-width="7"/>
    <ellipse cx="31" cy="36" rx="22" ry="30" fill="#d8f2a8" stroke="${ink}" stroke-width="2"/>
    <path d="M14 22 L48 50 M48 22 L14 50 M31 8 L31 64 M12 36 L50 36" stroke="#8a9a60" stroke-width="1.4"/>
  </g>`;
  if(kind==='garden') return `<g transform="translate(630,240)">
    <rect x="28" y="0" width="8" height="86" rx="3" fill="#c4a06a" stroke="${ink}" stroke-width="3"/>
    <path d="M8 86 L56 86 L60 118 L4 118 Z" fill="#3d8a28" stroke="${ink}" stroke-width="3"/>
    <path d="M10 118 L6 148 M20 118 L18 152 M32 118 L32 154 M44 118 L46 152 M54 118 L58 148" stroke="#d7d7d0" stroke-width="4" stroke-linecap="round"/>
  </g>`;
  return '';
}
function mediumSvg(kind, eve){
  const m = MEDIA[kind]||MEDIA.water;
  const sky = eve ? '#1b2438' : 'transparent';
  return `<svg class="medium" viewBox="0 0 800 500" aria-hidden="true">
    <rect width="800" height="500" fill="${sky}"/>
    ${waves(m)}
    ${kind==='garden'?gardenExtra():''}
    ${kind==='tennis'?tennisBalls():''}
    ${kind==='soup'?soupBits():''}
    ${standingTool(kind)}
  </svg>`;
}
function plateSrc(kind){
  const k = ['soup','tennis','garden','water'].includes(kind) ? kind : 'water';
  return 'plates/tub-'+k+'.png';
}
function spinDeg(boat){ return tipDeg(boat) - INHERENT; }
function moonMark(x, y){
  return `<path transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"
    d="M7-17.6A20 20 0 1 0 7 17.6A14.5 14.5 0 1 1 7-17.6Z"
    fill="#d8dde8" stroke="${ink}" stroke-width="3"/>`;
}
function sunSvg(boat){
  const a = boat.allDay ? 0 : boat.sunStart;
  const b = boat.allDay ? 1 : boat.sunEnd;
  const mid = rangeMidT(boat);
  const pm = sunPoint(mid);
  const dayTrack = sunPathD(0, T_DUSK);
  const nightTrack = sunPathD(T_DUSK, 1);
  const track = sunPathD(0, 1);
  const arc = boat.allDay ? track : sunPathD(a, b);
  const moon = isMoon(boat);
  const col = boat.must ? 'var(--must)' : (moon ? '#c5cbe0' : 'var(--sun)');
  const sunFill = isEvening(boat) ? '#d8dde8' : '#f5c431';
  return `<svg class="sundial" viewBox="0 -140 800 640" preserveAspectRatio="none" data-sun="1">
    <path d="${dayTrack}" fill="none" stroke="${ink}" stroke-width="6" opacity=".14"/>
    <path d="${nightTrack}" fill="none" stroke="${ink}" stroke-width="5" opacity=".08"/>
    <path d="${arc}" fill="none" stroke="${col}" stroke-width="${boat.allDay?18:14}"
      stroke-linecap="round" opacity="${boat.allDay?.55:.9}"/>
    ${moon ? moonMark(pm.x, pm.y)
      : `<circle cx="${pm.x.toFixed(1)}" cy="${pm.y.toFixed(1)}" r="20" fill="${sunFill}" stroke="${ink}" stroke-width="3"/>`}
    <path class="hit" d="${track}" stroke="transparent" stroke-width="52" fill="none"/>
  </svg>`;
}

function loadBoats(){
  if(new URLSearchParams(location.search).has('fresh')){
    sessionStorage.removeItem('amod-boats');
    sessionStorage.removeItem('amod-boats-v2');
  }
  try{
    const raw = sessionStorage.getItem('amod-boats-v2');
    if(raw){
      const parsed = JSON.parse(raw);
      if(Array.isArray(parsed) && parsed.length) return parsed;
    }
  }catch(e){}
  return [
    {id:'cook', day:0, medium:'soup', need:2, mates:['mia'], hours:4, sunStart:hourToT(8), sunEnd:hourToT(11), must:false, allDay:false, mine:false},
    {id:'tennis', day:1, medium:'tennis', need:3, mates:[], hours:5, sunStart:hourToT(9), sunEnd:hourToT(11), must:true, allDay:false, mine:false},
    {id:'garden', day:2, medium:'garden', need:1, mates:[], hours:2, sunStart:0, sunEnd:1, must:false, allDay:true, mine:false}
  ];
}
let boats = loadBoats();
function save(){ sessionStorage.setItem('amod-boats-v2', JSON.stringify(boats)); }

let peekId = null;
let composeId = null;
let pickerOn = false;
const anim = {};

function render(){
  const seq = boats.slice().sort((a,b)=>a.day-b.day || String(a.id).localeCompare(String(b.id)));
  $('cal').innerHTML = seq.map(boatRow).join('');
  $('picker').classList.toggle('on', pickerOn);
  $('picker').setAttribute('aria-hidden', pickerOn?'false':'true');
  if(pickerOn) renderPicker();
  bindPlates();
}
function boatRow(b){
  const d = dayMeta(b.day);
  const tip = spinDeg(b);
  const eve = isEvening(b);
  const peek = peekId===b.id ? ' peek' : '';
  const compose = composeId===b.id ? ' compose' : '';
  const seats = (b.mates||[]).map((id,i)=>{
    const p = mateBy(id); if(!p) return '';
    const s = SEATS[i] || {x:26+i*8, y:40};
    const extra = (anim[b.id]||{})[id] || '';
    return `<div class="seat ${id==='you'?'you':''} ${extra}" style="left:${s.x}%;top:${s.y}%">
      <img alt="" src="${p.photo}"/><span class="tag">${esc(p.name)}</span></div>`;
  }).join('');
  return `<div class="row ${b.day===0?'now':''} ${eve?'eve':''}" data-boat="${b.id}">
    <div class="day">${esc(d.short)}</div>
    <div class="plate${peek}${compose}" data-id="${b.id}" aria-label="Boat">
      ${mediumSvg(b.medium, eve)}
      <div class="tub-spin" style="transform:rotate(${tip}deg)">
        <img class="tub" alt="" draggable="false" src="${plateSrc(b.medium)}"/>
        <div class="mates">${seats}</div>
      </div>
      ${sunSvg(b)}
      <div class="hrs">${hoursMark(b)}</div>
    </div>
  </div>`;
}
function renderPicker(){
  $('picker').innerHTML = ['soup','tennis','garden'].map(k=>
    `<button type="button" class="pick" data-med="${k}" aria-label="${k}">${tinyPlate(k)}</button>`
  ).join('');
}
function tinyPlate(kind){
  return `<img alt="" src="${plateSrc(kind)}"/>`;
}

function findBoat(id){ return boats.find(b=>b.id===id); }

function togglePeek(id){
  peekId = peekId===id ? null : id;
  render();
}
function toggleJoin(id){
  const b = findBoat(id); if(!b || b.mine) return;
  const i = b.mates.indexOf('you');
  if(i>=0){
    anim[b.id] = {you:'you leave-x pop-out'};
    render();
    setTimeout(()=>{
      b.mates = b.mates.filter(m=>m!=='you');
      delete (anim[b.id]||{}).you;
      save(); render();
    }, 400);
  } else {
    if(b.mates.length>=Math.max(b.need,5)) return;
    b.mates = b.mates.concat('you');
    anim[b.id] = {you:'you pop-in'};
    save(); render();
    setTimeout(()=>{ if(anim[b.id]) delete anim[b.id].you; }, 500);
  }
}

function createBoat(medium){
  const id = 'b'+Date.now();
  boats.unshift({
    id, day:0, medium, need:1, mates:[], hours:3,
    sunStart:hourToT(8), sunEnd:hourToT(12),
    must:false, allDay:false, mine:true
  });
  composeId = id;
  peekId = id;
  pickerOn = false;
  save();
  render();
  $('cal').scrollTop = 0;
}

let drag = null;
function bindPlates(){
  $('cal').querySelectorAll('.plate').forEach(el=>{
    el.onpointerdown = onDown;
    el.onpointermove = onMove;
    el.onpointerup = onUp;
    el.onpointercancel = onUp;
  });
}

function onDown(e){
  const plate = e.currentTarget;
  const id = plate.dataset.id;
  const b = findBoat(id); if(!b) return;
  const sun = e.target.closest('[data-sun]');
  const startT = sun ? snapT(tFromPoint(e.clientX,e.clientY, sun)) : null;
  drag = {
    id, plate, pointer:e.pointerId,
    x:e.clientX, y:e.clientY, moved:false, held:false,
    sun: !!sun && !b.must, startT, lastT:startT,
    need0: b.need, tip0: e.clientY
  };
  try{ plate.setPointerCapture(e.pointerId); }catch(err){}
  drag.hold = setTimeout(()=>{
    if(!drag || drag.sun) return;
    drag.held = true;
    if(drag.hold){ clearTimeout(drag.hold); drag.hold=null; }
    toggleJoin(id);
  }, 400);
  if(drag.sun){
    showReadout(formatRange(b.sunStart, b.sunEnd, b.allDay));
  }
}
function onMove(e){
  if(!drag) return;
  const dx = e.clientX-drag.x, dy = e.clientY-drag.y;
  const dist = Math.hypot(dx,dy);
  if(dist>36) drag.moved = true;
  if(drag.sun && dist>8) drag.moved = true;
  if(drag.moved && drag.hold && (drag.sun || Math.abs(dy)>28)){ clearTimeout(drag.hold); drag.hold=null; }
  const b = findBoat(drag.id); if(!b) return;
  if(drag.sun){
    e.preventDefault();
    const svg = drag.plate.querySelector('[data-sun]');
    const t = tFromPoint(e.clientX,e.clientY,svg);
    let a = snapT(drag.startT), c = snapT(t);
    if(c<a){ const x=a; a=c; c=x; }
    if(c-a < T_HALF - 1e-9) c = snapT(Math.min(1, a + T_HALF));
    b.allDay = (a<=0.03 && c>=0.97);
    b.sunStart = b.allDay ? 0 : a;
    b.sunEnd = b.allDay ? 1 : c;
    const eve = isEvening(b);
    drag.plate.parentElement.classList.toggle('eve', eve);
    const wrap = drag.plate.querySelector('.sundial');
    if(wrap) wrap.outerHTML = sunSvg(b);
    showReadout(formatRange(b.sunStart, b.sunEnd, b.allDay));
    return;
  }
  if(composeId===b.id && drag.moved && Math.abs(dy)>Math.abs(dx)){
    e.preventDefault();
    const next = Math.max(1, Math.min(5, Math.round(drag.need0 + (-dy)/36)));
    if(next!==b.need){
      b.need = next;
      const spin = drag.plate.querySelector('.tub-spin');
      if(spin) spin.style.transform = `rotate(${spinDeg(b)}deg)`;
    }
  }
}
function onUp(e){
  if(!drag) return;
  if(drag.hold) clearTimeout(drag.hold);
  const id = drag.id;
  const wasSun = drag.sun;
  const moved = drag.moved;
  const held = drag.held;
  drag = null;
  if(wasSun){ hideReadout(); save(); render(); return; }
    if(!moved && !held){
    if(composeId && composeId!==id) composeId = null;
    togglePeek(id);
    return;
  }
  if(moved) save();
}

$('plus').onclick = ()=>{
  pickerOn = !pickerOn;
  if(pickerOn) composeId = null;
  render();
};
$('picker').onclick = e=>{
  const p = e.target.closest('[data-med]'); if(!p) return;
  createBoat(p.dataset.med);
};
$('cal').onclick = e=>{
  if(e.target.closest('.plate')) return;
  if(composeId){ composeId=null; render(); }
};

render();
</script>
</body>
</html>
